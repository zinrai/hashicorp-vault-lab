x-agent-base: &agent-base
  image: hashicorp/vault:2.0.2
  user: "0:0"
  environment:
    VAULT_ADDR: https://vault:8200
    VAULT_CACERT: /vault-tls/vault-ca.pem
    VAULT_TLS_SERVER_NAME: localhost
  entrypoint: ["/bin/sh", "/etc/vault-agent/entrypoint.sh"]
  tmpfs:
    - /vault-creds:size=1m
  depends_on:
    vault-init:
      condition: service_completed_successfully

x-app-base: &app-base
  image: vault-lab-app:latest
  build:
    context: ./app

services:
  vault:
    image: hashicorp/vault:2.0.2
    container_name: vault
    user: "0:0"
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: https://127.0.0.1:8200
      VAULT_CACERT: /vault/tls/vault-ca.pem
      VAULT_TLS_SERVER_NAME: localhost
    ports:
      - "8200:8200"
    volumes:
      - vault-tls:/vault/tls
      - vault-audit:/vault/logs
    # Bypass docker-entrypoint.sh: it drops to user `vault` via su-exec,
    # which can't remove pre-existing files in /vault/tls during dev-tls
    # bootstrap (the tls dir is shared with other containers and ends up
    # owned by root). We already have IPC_LOCK via cap_add, so setcap is
    # unnecessary; run vault directly as root.
    entrypoint: ["vault"]
    command: ["server", "-dev", "-dev-tls", "-dev-tls-cert-dir=/vault/tls"]
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 20

  local-idp:
    image: siocode/local-idp:latest
    container_name: local-idp
    ports:
      - "8080:8080"
    volumes:
      - ./local-idp/config.yaml:/config.yaml:ro

  postgres-main:
    image: postgres:18.4-trixie
    container_name: postgres-main
    environment:
      POSTGRES_USER: vault-admin
      POSTGRES_PASSWORD: adminpass
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault-admin"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-payment:
    image: postgres:18.4-trixie
    container_name: postgres-payment
    environment:
      POSTGRES_USER: vault-admin
      POSTGRES_PASSWORD: adminpass
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault-admin"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-analytics:
    image: postgres:18.4-trixie
    container_name: postgres-analytics
    environment:
      POSTGRES_USER: vault-admin
      POSTGRES_PASSWORD: adminpass
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault-admin"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-internal:
    image: postgres:18.4-trixie
    container_name: postgres-internal
    environment:
      POSTGRES_USER: vault-admin
      POSTGRES_PASSWORD: adminpass
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault-admin"]
      interval: 5s
      timeout: 3s
      retries: 10

  vault-init:
    image: hashicorp/vault:2.0.2
    container_name: vault-init
    user: "0:0"
    depends_on:
      vault:
        condition: service_healthy
      local-idp:
        condition: service_started
      postgres-main:
        condition: service_healthy
      postgres-payment:
        condition: service_healthy
      postgres-analytics:
        condition: service_healthy
      postgres-internal:
        condition: service_healthy
    environment:
      VAULT_ADDR: https://vault:8200
      VAULT_CACERT: /vault-tls/vault-ca.pem
      VAULT_TLS_SERVER_NAME: localhost
      VAULT_TOKEN: root
    volumes:
      - ./vault-init:/init:ro
      - vault-tls:/vault-tls:ro
      - vault-bootstrap:/vault-bootstrap
    entrypoint: ["/bin/sh", "/init/init.sh"]
    restart: "no"

  app-web-frontend-agent:
    <<: *agent-base
    container_name: app-web-frontend-agent
    environment:
      APP_NAME: web-frontend
      VAULT_ADDR: https://vault:8200
      VAULT_CACERT: /vault-tls/vault-ca.pem
      VAULT_TLS_SERVER_NAME: localhost
    volumes:
      - ./vault-agent-configs/entrypoint.sh:/etc/vault-agent/entrypoint.sh:ro
      - ./vault-agent-configs/web-frontend.hcl:/etc/vault-agent/config.hcl:ro
      - vault-tls:/vault-tls:ro
      - vault-bootstrap:/vault-bootstrap:ro
      - web-frontend-rendered:/vault/file

  app-web-frontend:
    <<: *app-base
    container_name: app-web-frontend
    depends_on:
      app-web-frontend-agent:
        condition: service_started
    volumes:
      - ./apps/web-frontend.yaml:/etc/app/config.yaml:ro
      - web-frontend-rendered:/secrets:ro

  app-api-server-agent:
    <<: *agent-base
    container_name: app-api-server-agent
    environment:
      APP_NAME: api-server
      VAULT_ADDR: https://vault:8200
      VAULT_CACERT: /vault-tls/vault-ca.pem
      VAULT_TLS_SERVER_NAME: localhost
    volumes:
      - ./vault-agent-configs/entrypoint.sh:/etc/vault-agent/entrypoint.sh:ro
      - ./vault-agent-configs/api-server.hcl:/etc/vault-agent/config.hcl:ro
      - vault-tls:/vault-tls:ro
      - vault-bootstrap:/vault-bootstrap:ro
      - api-server-rendered:/vault/file

  app-api-server:
    <<: *app-base
    container_name: app-api-server
    depends_on:
      app-api-server-agent:
        condition: service_started
    volumes:
      - ./apps/api-server.yaml:/etc/app/config.yaml:ro
      - api-server-rendered:/secrets:ro

  app-admin-panel-agent:
