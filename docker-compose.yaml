      - payment-rendered:/secrets:ro

  app-notification-agent:
    <<: *agent-base
    container_name: app-notification-agent
    environment:
      APP_NAME: notification
      VAULT_ADDR: https://vault:8200
      VAULT_CACERT: /vault-tls/vault-ca.pem
      VAULT_TLS_SERVER_NAME: localhost
    volumes:
      - ./vault-agent-configs/entrypoint.sh:/etc/vault-agent/entrypoint.sh:ro
      - ./vault-agent-configs/notification.hcl:/etc/vault-agent/config.hcl:ro
      - vault-tls:/vault-tls:ro
      - vault-bootstrap:/vault-bootstrap:ro
      - notification-rendered:/vault/file

  app-notification:
    <<: *app-base
    container_name: app-notification
    depends_on:
      app-notification-agent:
        condition: service_started
    volumes:
