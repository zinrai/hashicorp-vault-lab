    volumes:
      - ./vault-agent-configs/entrypoint.sh:/etc/vault-agent/entrypoint.sh:ro
      - ./vault-agent-configs/auth-service.hcl:/etc/vault-agent/config.hcl:ro
      - vault-tls:/vault-tls:ro
      - vault-bootstrap:/vault-bootstrap:ro
      - auth-service-rendered:/vault/file

  app-auth-service:
    <<: *app-base
    container_name: app-auth-service
    depends_on:
      app-auth-service-agent:
        condition: service_started
    volumes:
      - ./apps/auth-service.yaml:/etc/app/config.yaml:ro
      - auth-service-rendered:/secrets:ro

  app-payment-agent:
