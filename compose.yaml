# The Vault from the environment, not defined here: the lab runs on a Vault
# that runs elsewhere, named by VAULT_ADDR and VAULT_CACERT as for the vault
# CLI. On its network, VAULT_NETWORK, not one of our own: the Vault nodes
# reach the databases and the IdP by name. Agents and applications in a
# profile, not started with the rest: they need the Vault configured and
# their wrap tokens handed over first.

x-postgres: &postgres
  image: postgres:18.4-trixie
  restart: unless-stopped
  environment:
    POSTGRES_USER: vault-admin
    POSTGRES_PASSWORD: adminpass
    POSTGRES_DB: postgres
  networks: [vault]

# Root, not the vault user: the agent writes the rendered files 0400 for the
# application, which runs as root too (docs/OVERVIEW.md, simplifications).
x-agent: &agent
  image: hashicorp/vault:2.1.1
  profiles: [apps]
  user: "0:0"
  entrypoint: ["/bin/sh", "/lab/vault-agent-configs/entrypoint.sh"]
  environment:
    VAULT_ADDR: ${VAULT_ADDR:?VAULT_ADDR is the Vault the lab runs on}
    VAULT_CACERT: /vault-ca/ca.crt
  tmpfs:
    - /vault-creds:size=1m
  networks: [vault]

# One image for all twelve, built from app/: what each one is comes from
# apps/<name>.yaml.
x-app: &app
  build: ./app
  image: vault-lab-app
  profiles: [apps]
  user: "0:0"
  networks: [vault]

services:
  # Published on the host's loopback, not only on the network: the browser
  # of an OIDC login has to reach it as well as Vault.
  local-idp:
    image: ghcr.io/dexidp/dex:v2.45.1
    container_name: local-idp
    restart: unless-stopped
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "127.0.0.1:5556:5556"
    volumes:
      - ./local-idp/config.yaml:/etc/dex/config.yaml:ro
    networks: [vault]

  postgres-main:
    <<: *postgres
    container_name: postgres-main

  postgres-payment:
    <<: *postgres
    container_name: postgres-payment

  postgres-analytics:
    <<: *postgres
    container_name: postgres-analytics

  postgres-internal:
    <<: *postgres
    container_name: postgres-internal

  app-web-frontend-agent:
    <<: *agent
    container_name: app-web-frontend-agent
    command: [web-frontend]
    volumes:
      - ./vault-agent-configs:/lab/vault-agent-configs:ro
      - ${VAULT_CACERT:?VAULT_CACERT is the CA of the Vault the lab runs on}:/vault-ca/ca.crt:ro
      - ./bootstrap/web-frontend:/vault-bootstrap/web-frontend:ro
      - web-frontend-rendered:/vault/file

  app-web-frontend:
    <<: *app
    container_name: app-web-frontend
    depends_on: [app-web-frontend-agent]
    volumes:
      - ./apps/web-frontend.yaml:/etc/app/config.yaml:ro
      - web-frontend-rendered:/secrets:ro

  app-api-server-agent:
